# SPID/CIE OIDC local test federation.
#   trust-anchor.paperopoli.derrigo.it:8000  Federation Authority (Trust Anchor) - official italia image
#   cie-provider.paperopoli.derrigo.it:8002  OpenID Provider (CIE)               - official italia image
#   identity.paperopoli.derrigo.it:8001 .NET Relying Party (Duckburg.Identity)
#
# Add to your hosts file (see scripts/):
#   127.0.0.1  trust-anchor.paperopoli.derrigo.it  identity.paperopoli.derrigo.it  cie-provider.paperopoli.derrigo.it
services:
  trust-anchor.paperopoli.derrigo.it:
    # pinned by digest for reproducibility (the committed infra/ dumps must match this image)
    image: ghcr.io/italia/spid-cie-oidc-django@sha256:80b594f122139f9264a2ef035d975e29ef49dbf766b087a78f54f67dce24c5be
    ports:
      - "8000:8000"
    volumes:
      - ./infra/federation_authority:/django-project
    networks:
      - oidcfed
    command: >
      bash -c "cd /django-project/ &&
      python3 manage.py migrate &&
      python3 manage.py loaddata dumps/example.json &&
      python3 manage.py runserver 0.0.0.0:8000"

  cie-provider.paperopoli.derrigo.it:
    # pinned by digest for reproducibility (the committed infra/ dumps must match this image)
    image: ghcr.io/italia/spid-cie-oidc-django@sha256:80b594f122139f9264a2ef035d975e29ef49dbf766b087a78f54f67dce24c5be
    ports:
      - "8002:8002"
    volumes:
      - ./infra/provider:/django-project
    networks:
      - oidcfed
    depends_on:
      - trust-anchor.paperopoli.derrigo.it
    command: >
      bash -c "cd /django-project/ &&
      python3 manage.py migrate &&
      python3 manage.py loaddata dumps/example.json &&
      python3 manage.py runserver 0.0.0.0:8002"

  identity.paperopoli.derrigo.it:
    build:
      context: ./Duckburg.Identity
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      # the local docker stack is a test/dev environment: enables the local provider button.
      - ASPNETCORE_ENVIRONMENT=Development
      # DEMO ONLY: load the test RP private keys from the mounted secret file.
      # In production set Rp__PrivateKeys (env / Key Vault) or mount a real secret here.
      - Rp__PrivateKeysFile=/secrets/rp_private_keys.json
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - oidcfed
    depends_on:
      - trust-anchor.paperopoli.derrigo.it
      - cie-provider.paperopoli.derrigo.it

networks:
  oidcfed:
