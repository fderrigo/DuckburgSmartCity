# Federazione SPID/CIE in produzione.
#
# Nessun riferimento a un ambiente specifico: gli hostname arrivano da deploy/.env
# (vedi .env.example) e i file di configurazione sostituiti vivono in deploy/runtime/,
# generata da prepara-runtime.sh e non versionata.
#
#   cp deploy/.env.example deploy/.env    # e modifica i valori
#   bash deploy/prepara-runtime.sh
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Differenze dal docker-compose.yml di sviluppo:
#   - nessuna porta pubblicata dai tre servizi: si raggiungono solo tramite Caddy,
#     altrimenti Django resterebbe esposto in chiaro sull'IP della macchina
#   - Caddy davanti, che termina il TLS e ottiene i certificati da Let's Encrypt
#   - Identity in Production, con le chiavi private montate da fuori dal repository
#   - limiti di memoria e oom_score_adj su ogni container
#
# I nomi dei servizi sono neutri, ma ogni container ha come alias di rete il proprio
# hostname pubblico: serve alla federazione, che risolve le entita' per entity id.
# Senza l'alias, identity uscirebbe su Internet e rientrerebbe per parlare con il
# trust anchor che ha a un centimetro di distanza.
#
# Perche' i limiti di memoria: su una macchina condivisa, quando la memoria finisce
# il kernel sceglie da solo chi uccidere, e la vittima naturale e' il processo piu'
# grosso, che di solito non e' questo stack. Con mem_limit i container non crescono
# oltre la quota, e con oom_score_adj positivo sono loro i primi candidati.

name: paperopoli

services:
  trust-anchor:
    # pinned by digest for reproducibility (i dump in runtime/ devono corrispondere)
    image: ghcr.io/italia/spid-cie-oidc-django@sha256:80b594f122139f9264a2ef035d975e29ef49dbf766b087a78f54f67dce24c5be
    restart: unless-stopped
    mem_limit: ${MEM_DJANGO:-220m}
    oom_score_adj: 500
    volumes:
      - ./runtime/federation_authority:/django-project
    networks:
      oidcfed:
        aliases:
          - ${TRUST_ANCHOR_HOST}
    command: >
      bash -c "cd /django-project/ &&
      python3 manage.py migrate &&
      python3 manage.py loaddata dumps/example.json &&
      python3 manage.py runserver 0.0.0.0:8000"

  cie-provider:
    image: ghcr.io/italia/spid-cie-oidc-django@sha256:80b594f122139f9264a2ef035d975e29ef49dbf766b087a78f54f67dce24c5be
    restart: unless-stopped
    mem_limit: ${MEM_DJANGO:-220m}
    oom_score_adj: 500
    volumes:
      - ./runtime/provider:/django-project
    networks:
      oidcfed:
        aliases:
          - ${CIE_PROVIDER_HOST}
    depends_on:
      - trust-anchor
    command: >
      bash -c "cd /django-project/ &&
      python3 manage.py migrate &&
      python3 manage.py loaddata dumps/example.json &&
      python3 manage.py runserver 0.0.0.0:8002"

  identity:
    build:
      context: ../Duckburg.Identity
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${MEM_IDENTITY:-260m}
    oom_score_adj: 500
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Configurazione pubblica del RP con gli entity id di questo ambiente,
      # generata da prepara-runtime.sh.
      - Rp__PublicConfigFile=/config/rp_public.json
      # Chiavi private: fuori dal repository, montate in sola lettura.
      - Rp__PrivateKeysFile=/secrets/rp_private_keys.json
      # Provider mostrati nella pagina di login. In Production
      # appsettings.Development.json non viene caricato, quindi vanno dati qui.
      - Oidc__LocalProviders__0__Profile=spid
      - Oidc__LocalProviders__0__Name=BeccoID
      - Oidc__LocalProviders__0__EntityId=https://${TRUST_ANCHOR_HOST}/oidc/op
      - Oidc__LocalProviders__1__Profile=cie
      - Oidc__LocalProviders__1__Name=IPZP
      - Oidc__LocalProviders__1__EntityId=https://${CIE_PROVIDER_HOST}/oidc/op
      # Link incrociati verso gli altri portali: cablarli renderebbe le pagine
      # di Identity piene di collegamenti a localhost.
      - Siti__Portale=${PORTALE_URL}
      - Siti__ServiziOnline=${SERVIZIONLINE_URL}
      # Whitelist dei ritorni SSO: protezione contro l'open redirect.
      - Sso__AllowedReturnUrls__0=${SERVIZIONLINE_URL}/auth/callback
      - Sso__AllowedPostLogoutUrls__0=${SERVIZIONLINE_URL}/
      # Il GC di .NET legge da solo il limite del cgroup e dimensiona l'heap su
      # quello, quindi mem_limit basta.
    volumes:
      - ./runtime/rp_public.json:/config/rp_public.json:ro
      - ${RP_SECRETS_DIR}:/secrets:ro
    networks:
      oidcfed:
        aliases:
          - ${IDENTITY_HOST}
    depends_on:
      - trust-anchor
      - cie-provider

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${MEM_CADDY:-96m}
    oom_score_adj: 300
    ports:
      - "80:80"
      - "443:443"
    environment:
      - IDENTITY_HOST=${IDENTITY_HOST}
      - TRUST_ANCHOR_HOST=${TRUST_ANCHOR_HOST}
      - CIE_PROVIDER_HOST=${CIE_PROVIDER_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - oidcfed
    depends_on:
      - trust-anchor
      - cie-provider
      - identity

networks:
  oidcfed:

volumes:
  caddy_data:
  caddy_config:
